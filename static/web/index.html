<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>Homebase</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27%23111113%27/%3E%3Cpath d=%27M14 34 32 18l18 16v14H14z%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%273.5%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="/static/web/web.css">
</head>
<body>

<div id="auth" class="hidden"><div class="authbox" id="authbox"></div></div>

<div id="app" class="hidden">
  <header class="top">
    <div class="brand">🏠 Homebase <small id="famname"></small></div>
    <div class="grow"></div>
    <div class="pillgroup">
      <button class="btn sm" id="bOk" title="Tell everyone you are OK">✅ <span>I'm OK</span></button>
      <button class="btn sm" id="bLate" title="Running late">⏰ <span>Late</span></button>
      <button class="btn sm bad" id="bSos" title="Hold for 2 seconds">🆘 <span>SOS (hold)</span></button>
    </div>
    <button class="btn sm" id="bInvite">＋ Invite</button>
    <button class="btn sm" id="bMe">☰ Me</button>
  </header>
  <main class="layout" id="layout" data-tab="map">
    <aside class="col" id="side"></aside>
    <section id="mapwrap">
      <div id="map"></div>
      <div class="maptools">
        <button class="btn sm" id="bFit">Show everyone</button>
        <button class="btn sm" id="bAddPlace">＋ Place</button>
        <button class="btn sm" id="bTheme" title="Switch the map between dark and light">◐ Map</button>
      </div>
    </section>
    <aside class="col" id="chat">
      <div class="thr" id="thr"></div>
      <div id="msgs"></div>
      <form class="composer" id="composer"><input class="field" id="msgIn" placeholder="Write a message" autocomplete="off" maxlength="600"><button class="btn solid" type="submit">Send</button></form>
    </aside>
  </main>
  <nav class="tabs" id="tabs"><button data-t="map" class="on">Map</button><button data-t="family">Family</button><button data-t="chat">Chat</button></nav>
</div>

<div id="over"></div>
<div id="call"></div>
<div id="toasts"></div>
<audio id="remote" autoplay></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/static/web/web.js"></script>
<script src="/static/web/calls.js"></script>
</body>
</html>
