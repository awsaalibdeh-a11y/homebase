<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f6f7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Homebase</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/web/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/web/icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="/static/web/web.css">
</head>
<body>

<div id="auth" class="hidden"><div class="authbox" id="authbox"></div></div>

<div id="app" class="hidden">
  <div id="map"></div>
  <div class="topbar">
    <div class="pill brand">🏠 <b>Homebase</b> <small id="famname"></small></div>
    <div class="grow"></div>
    <div class="pill actions">
      <button id="bOk" title="Tell everyone you are OK">✅ <span>I'm OK</span></button>
      <button id="bLate" title="Running late">⏰ <span>Late</span></button>
      <button id="bSos" class="sos" title="Hold for 2 seconds">🆘 <span>SOS</span></button>
      <i class="sep"></i>
      <button id="bInvite">＋ <span>Invite</span></button>
      <button id="bMe" title="Settings">☰ <span>Menu</span></button>
    </div>
  </div>
  <aside class="panel" id="side"></aside>
  <aside class="panel hidden" id="chat">
    <div class="chathead"><h2>Messages</h2><button class="btn sm" id="chatX" aria-label="Close messages">✕</button></div>
    <div class="thr" id="thr"></div>
    <div id="msgs"></div>
    <div class="qr" id="qr"></div>
    <form class="composer" id="composer"><input class="field" id="msgIn" placeholder="Write a message" autocomplete="off" maxlength="600"><button class="btn solid" type="submit">Send</button></form>
  </aside>
  <div class="pill dock">
    <button class="sq" id="bZoomOut" aria-label="Zoom out">−</button><button class="sq" id="bZoomIn" aria-label="Zoom in">+</button>
    <button id="bFit">Show everyone</button><button id="bAddPlace">＋ Place</button><button id="bLayer" title="Map style">◐ Map</button>
  </div>
  <button class="fab" id="chatFab">💬 <span class="t">Messages</span> <span class="n hidden" id="fabN"></span></button>
  <div id="offline" class="hidden"></div>
</div>

<div id="over"></div>
<div id="call"></div>
<div id="toasts"></div>
<audio id="remote" autoplay></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/static/web/web.js"></script>
<script src="/static/web/calls.js"></script>
<script src="/static/tour.js" data-app="homebase" defer></script>
<script src="/static/hub.js" data-app="homebase" defer></script>
</body>
</html>
